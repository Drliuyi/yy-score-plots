name: project checks

on:
  push:
  pull_request:

jobs:
  shell-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: f/config/requirements-py39.txt
      - run: python -m pip install -r f/config/requirements-py39.txt
      - run: python f/tests/test_entrypoint.py
      - run: python f/tests/test_full_reproduction.py
      - run: python f/tests/test_directnas_windows.py
      - run: python f/tests/test_batched_prs_score.py

  r-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.3.2"
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::data.table
            any::R.utils
            any::bit64
            any::jsonlite
            any::digest
            any::survival
            any::pROC
            any::ggplot2
            any::patchwork
            any::ggrepel
            any::igraph
            any::scales
      - run: Rscript --vanilla f/tests/test_full_reproduction.R
      - run: Rscript --vanilla f/tests/test_prs_reference_contract.R
      - run: Rscript --vanilla f/tests/test_figure6_systems.R
      - run: Rscript --vanilla f/tests/test_figure_smoke.R
